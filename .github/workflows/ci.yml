name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run server:go:test
      - run: npm run build
      - run: npx wrangler deploy --dry-run --config apps/edge-worker/wrangler.jsonc
